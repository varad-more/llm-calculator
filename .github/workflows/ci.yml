name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22.18', cache: pnpm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pnpm install --frozen-lockfile

      # data/ -> generated.ts and _generated.py; a diff here means someone edited data
      # without running `pnpm gen`.
      - run: pnpm gen
      - run: git diff --exit-code -- packages/core/src/generated.ts python/llmsize/_generated.py docs/ASSUMPTIONS.md docs/HARDWARE.md

      - run: pnpm -F @llmsize/core build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node --experimental-strip-types --test packages/*/test/*.test.ts validation/*.test.ts
      - run: python3 python/tests/test_golden.py

      # Golden fixtures are the TS<->Python contract; regenerating must be a no-op.
      - run: pnpm goldens
      - run: git diff --exit-code -- fixtures/golden

      # The credibility gate: every contributed engine log must stay inside tolerance.
      - run: pnpm validate -- --check

      - run: pnpm build
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with: { path: apps/web/out }

  deploy:
    if: github.event_name == 'push'
    needs: test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
